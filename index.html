<!DOCTYPE html>
<html lang="de" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sharkie</title>
    <link
      rel="shortcut icon"
      href="./img/1.Sharkie/1.IDLE/1.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="./styles/title-screen.css" />
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./styles/end-screen.css" />
    <script src="./js/titleScreen.js"></script>
    <script src="./models/drawable-Object.class.js"></script>
    <script src="./models/movable-obj.class.js"></script>
    <script src="./models/collectableObjects.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/blubbFish.class.js"></script>
    <script src="./models/jellyFish.class.js"></script>
    <script src="./models/status-bar.class.js"></script>
    <script src="./models/bubble-bar.class.js"></script>
    <script src="./models/coin-bar.class.js"></script>
    <script src="./models/bottles.class.js"></script>
    <script src="./models/coins.class.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./models/godRays.class.js"></script>
    <script src="./models/backround.object.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./models/shootable.object.class.js"></script>
    <script src="./models/charged-bubble.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./levels/level1.js"></script>
    <script src="./js/game.js"></script>
    <script src="./js/endScreen.js"></script>
  </head>
  <body onload="">
    <h1>Sharkie</h1>
    <div id="rotateOverlay">Bitte drehe dein Gerät ins Querformat!</div>
    <div id="divCanvas">
      <div id="pauseButtonContainer">
        <div>
        <img id="muteButton" src="img/6.Botones/sound-on-removebg-preview.png" alt="button to mute">
        </div>
        <img id="pauseButton" src="img/6.Botones/pause-button-removebg-preview.png" alt="pause button image">
      </div>
      <div id="pauseOverlay">
        <p>PAUSE</p>
        <img id="resumeButton" src="img/6.Botones/Start/2.png" alt="">
      </div>
      <canvas id="canvas" width="720px" height="480px"></canvas>
    </div>
    <div id="titleScreen">
      <div class="barriers">
        <div class="titlescreen-images">
          <div class="sharkie">
            <img src="./img/1.Sharkie/1.IDLE/Prewiew.gif" alt="" />
          </div>
          <div class="blubbfish">
            <img
              src="./img/2.Enemy/1.Puffer fish (3 color options)/3.Bubbleeswim/Preview.gif"
              alt=""
            />
          </div>
        </div>
        <div class="start-button-container">
          <img
            id="startButton"
            onclick="playStartSound(), init() "
            src="./img/6.Botones/Start/3.png"
            alt=""
          />
        </div>
      </div>
    </div>
    <div id="looseEndScreen">
      <div id="deadSharkie">
        <img src="./img/1.Sharkie/6.dead/1.Poisoned/12.png" alt="" />
      </div>
      <div id="gameOverLine">
        <img src="./img/6.Botones/Tittles/Game Over/Recurso 12.png" alt="" />
      </div>
      <div id="tryAgainLoose">
        <img
          id="tryAgainLooseImg"
          class="try-again-loose"
          onclick="playStartSound(), restartGame()"
          src="./img/6.Botones/Try again/Recurso 15.png"
          alt=""
        />
      </div>
    </div>
    <div id="winEndScreen">
      <div id="tryAgainWin">
        <img
          id="tryAgainWinImg"
          class="try-again-win"
          onclick="playStartSound(), restartGame()"
          src="./img/6.Botones/Try again/Recurso 15.png"
          alt=""
        />
      </div>
    </div>
  </body>
</html>
